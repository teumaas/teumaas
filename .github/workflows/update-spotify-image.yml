name: Update Spotify Image

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update cache buster
        run: |
          TS=$(date +%s)
          sed -i -E "s#(https://tomsmits.nl/spotify/spotify.svg\\?v=)[0-9]+#\\1$TS#g" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Update Spotify image cache buster" || exit 0
          git push